name: Compilar APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Sonidos de BigSoundBank (CC0): se descargan y preparan al compilar.
      # Si alguno falla, la app se compila igual y ese sonido no aparece.
      - name: Sonidos de BigSoundBank
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          chmod +x tools/preparar_sonido.sh
          mkdir -p "$RUNNER_TEMP/bsb"
          while read id nombre; do
            [ -z "$id" ] && continue
            if curl -fsSL --retry 3 -A "Tranqui (GitHub Actions)" -o "$RUNNER_TEMP/bsb/$id.mp3" "https://bigsoundbank.com/UPLOAD/mp3/$id.mp3"; then
              tools/preparar_sonido.sh "$RUNNER_TEMP/bsb/$id.mp3" "app/src/main/assets/soundscape/sounds/$nombre.ogg" 120 bucle || echo "::warning::No se pudo preparar $nombre"
            else
              echo "::warning::No se pudo descargar $id ($nombre)"
            fi
          done < tools/bigsoundbank.txt
          ls -la app/src/main/assets/soundscape/sounds

      - name: Preparar la clave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.TRANQUI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Faltan los secretos de firma. Se compila para comprobar el código, pero no se publica el APK."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tranqui.jks"
            echo "ok=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        env:
          TRANQUI_KEYSTORE_PATH: ${{ runner.temp }}/tranqui.jks
          TRANQUI_KEYSTORE_PASSWORD: ${{ secrets.TRANQUI_KEYSTORE_PASSWORD }}
          TRANQUI_KEY_ALIAS: ${{ secrets.TRANQUI_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/tranqui.jks"

      - name: Leer versión
        id: ver
        run: echo "v=v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Renombrar APK
        if: steps.firma.outputs.ok == 'si'
        run: cp app/build/outputs/apk/release/app-release.apk "Tranqui-${{ steps.ver.outputs.v }}.apk"

      - uses: actions/upload-artifact@v4
        if: steps.firma.outputs.ok == 'si'
        with:
          name: Tranqui-apk
          path: Tranqui-*.apk

      # Cada vez que cambia versionName en app/build.gradle.kts, se publica una versión nueva.
      - name: ¿Versión nueva?
        id: nueva
        if: steps.firma.outputs.ok == 'si' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.v }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "publicar=no" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar versión
        if: steps.nueva.outputs.publicar == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Tranqui ${{ steps.ver.outputs.v }}
          files: Tranqui-*.apk
          body: |
            Descargá el APK de abajo e instalalo. Si ya tenías Tranqui, se instala encima sin perder tus datos.
