<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Paisajes sonoros</title>
<style>
:root{--lino:#F3EFE5;--papel:#FAF7EF;--borde:#E4DDCF;--salvia:#A7B39B;--salvia-clara:#E3E6D8;--bosque:#344C40;--texto2:#55655A;--arcilla:#D5A080;--arena:#D9D2C5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--lino);color:var(--bosque);font-family:system-ui,-apple-system,"Roboto",sans-serif;overflow:hidden}
#cv{width:100%;height:230px;display:block;border-radius:24px;background:var(--papel)}
.pals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pal{min-height:48px;border-radius:22px;border:1px solid var(--borde);background:var(--papel);color:var(--bosque);font-size:15px;font-family:inherit}
.pal.on{background:var(--bosque);color:var(--lino);border-color:var(--bosque)}
.row{display:flex;align-items:center;gap:12px;margin-top:12px}
.row label{font-size:14px;color:var(--texto2);min-width:64px}
.row span{font-size:14px;min-width:46px;text-align:right}
input[type=range]{flex:1;accent-color:var(--bosque);height:32px}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;min-height:52px;border-radius:26px;border:none;font-size:16px;font-family:inherit}
.play{background:var(--bosque);color:var(--lino)}
.soft{background:var(--papel);color:var(--bosque);border:1px solid var(--borde)}
#note{font-size:13px;color:var(--texto2);margin:10px 2px 0;line-height:1.4}
</style>
</head>
<body>
<canvas id="cv" aria-label="Bruma que cambia de forma según el sonido" role="img"></canvas>
<div class="pals">
  <button class="pal on" data-p="bruma">Bruma</button>
  <button class="pal" data-p="cuencos">Cuencos</button>
  <button class="pal" data-p="agua">Agua</button>
  <button class="pal" data-p="bosque">Bosque</button>
  <button class="pal" data-p="fuego">Fuego</button>
  <button class="pal" id="tun">440 Hz</button>
</div>
<div class="row"><label for="pitch">Tono</label><input id="pitch" type="range" min="-12" max="12" step="1" value="-2"><span id="pito">−2</span></div>
<div class="row"><label for="vol">Volumen</label><input id="vol" type="range" min="0" max="100" step="1" value="50"><span></span></div>
<div class="actions">
  <button id="play" class="btn play">Escuchar</button>
  <button id="timer" class="btn soft">Sin temporizador</button>
</div>
<p id="note"></p>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H;
function size(){const r=cv.getBoundingClientRect();W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio}size();addEventListener('resize',size);
let ac,master,bus,rev,white,brown,playing=false,pal='bruma',timer=null,evTimer=null,energy=0,voices=[],bed=[],shift=-2,nextEv=0,ref=440,seqI=0,stopAt=0,timerMin=0;
const SC=[0,2,4,7,9],rnd=(a,b)=>a+Math.random()*(b-a),hz=m=>ref*Math.pow(2,(m+shift-69)/12),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// Grabaciones reales: si están en assets/soundscape/sounds, se usan en lugar del sonido generado.
let realFiles=[];try{realFiles=(window.TranquiApp?TranquiApp.sounds():'').split(',').filter(Boolean)}catch(e){}
const samples={};
function fileFor(name){return realFiles.find(f=>f.replace(/\.[^.]+$/,'')===name)}
async function sample(name){if(name in samples)return samples[name];const f=fileFor(name);if(!f){samples[name]=null;return null}
 try{const r=await fetch('sounds/'+f);const ab=await r.arrayBuffer();samples[name]=await ac.decodeAudioData(ab)}catch(e){samples[name]=null}return samples[name]}
function notes(lo,hi){const a=[];for(let m=lo;m<=hi;m++)if(SC.includes(m%12))a.push(m);return a}
function imp(sec){const len=ac.sampleRate*sec,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return b}
function noiseBuf(type){const len=ac.sampleRate*5,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(type=='w')d[i]=w;else{l=(l+0.02*w)/1.02;d[i]=l*3.5}}return b}
function init(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5500;lp.Q.value=0.3;const comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;
 lp.connect(comp);comp.connect(master);master.connect(ac.destination);bus=ac.createGain();bus.gain.value=0.55;bus.connect(lp);
 rev=ac.createConvolver();rev.buffer=imp(6);const wet=ac.createGain();wet.gain.value=0.65;rev.connect(wet);wet.connect(lp);white=noiseBuf('w');brown=noiseBuf('b')}
function route(node,wetOn=true,pan=0.6){const p=ac.createStereoPanner?ac.createStereoPanner():null;let n=node;if(p){p.pan.value=rnd(-pan,pan);node.connect(p);n=p}n.connect(bus);if(wetOn)n.connect(rev)}
function lfo(freq,depth,target,t,stop){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.value=depth;o.connect(g);g.connect(target);o.start(t);o.stop(stop)}
function pad(opt){return (f,t,d,hi)=>{const g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.3;const cut=opt.cut*(hi?0.75:1);
  lp.frequency.setValueAtTime(cut*0.5,t);lp.frequency.linearRampToValueAtTime(cut,t+opt.att+2);lp.connect(g);route(g);
  const stop=t+d+14,att=opt.att*(hi?1.6:1),peak=opt.gain*(hi?0.45:1);
  opt.det.forEach(c=>{const o=ac.createOscillator();o.type=opt.type;o.frequency.value=f;o.detune.value=c+rnd(-2,2);lfo(rnd(0.12,0.3),3,o.detune,t,stop);o.connect(lp);o.start(t);o.stop(stop)});
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setValueAtTime(peak,t+d);g.gain.setTargetAtTime(0.0001,t+d,2.8);return{t,d:d+6,peak:hi?0.6:1}}}
function bass(f,t,d){const g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.connect(g);route(g,true,0.15);const stop=t+d+14;
 [['triangle',-4],['sine',4]].forEach(([ty,c])=>{const o=ac.createOscillator();o.type=ty;o.frequency.value=f;o.detune.value=c;o.connect(lp);o.start(t);o.stop(stop)});
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.05,t+4);g.gain.setValueAtTime(0.05,t+d);g.gain.setTargetAtTime(0.0001,t+d,3)}
function bowl(f,t,d,hi,semis){
 const buf=samples.cuenco;
 if(buf){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=buf;s.playbackRate.value=Math.pow(2,(semis+shift)/12);g.gain.value=0.5;s.connect(g);route(g);s.start(t);return{t,d:Math.min(d,buf.duration),peak:0.9}}
 const g=ac.createGain();g.gain.value=0.1;route(g);const stop=t+d+10;
 [[1,1,d/2.4],[2,0.2,d/4],[3,0.06,d/6]].forEach(([r,a,tau])=>{[-0.35,0.35].forEach(df=>{const o=ac.createOscillator(),gg=ac.createGain();o.type='sine';o.frequency.value=f*r+df*r;
  gg.gain.setValueAtTime(0.0001,t);gg.gain.linearRampToValueAtTime(a*0.5,t+0.25);gg.gain.setTargetAtTime(0.0001,t+0.3,tau);o.connect(gg);gg.connect(g);o.start(t);o.stop(stop)})});return{t,d:d,peak:0.9}}
const softPad=pad({type:'sine',det:[-6,0,6],cut:1500,att:3.5,gain:0.045});
const P={
 bruma:{lo:45,hi:74,hiFrom:67,dur:[9,15],cnt:[1,2],sp:[3,5],gap:[2,4],v:pad({type:'triangle',det:[-8,0,8],cut:1600,att:3.5,gain:0.06}),root:48,sh:-2,mode:'calm',c:[[120,150,190],[150,140,195]],label:'Bruma'},
 cuencos:{seq:[0,7,4,12,7,4,2,7],dur:[13,16],gap:[6,8],v:bowl,root:48,sh:0,mode:'calm',c:[[200,150,100],[180,135,95]],label:'Cuencos'},
 agua:{lo:45,hi:72,hiFrom:67,dur:[10,15],cnt:[1,1],sp:[4,6],gap:[4,7],v:softPad,root:48,sh:0,mode:'agua',nat:'agua',c:[[90,150,190],[80,165,165]],label:'Agua'},
 bosque:{lo:43,hi:69,hiFrom:65,dur:[10,15],cnt:[1,1],sp:[4,6],gap:[5,8],v:softPad,root:43,sh:0,mode:'bosque',nat:'bosque',c:[[100,150,105],[140,165,95]],label:'Bosque'},
 fuego:{lo:43,hi:64,hiFrom:99,dur:[10,15],cnt:[1,1],sp:[4,6],gap:[5,8],v:softPad,root:43,sh:0,mode:'fuego',nat:'fuego',c:[[230,140,70],[210,90,50]],label:'Fuego'}};
function src(buf){const s=ac.createBufferSource();s.buffer=buf;s.loop=true;return s}
async function startBed(){stopBed();const p=P[pal],mine=pal,t0=ac.currentTime,k=p.nat?0.55:1;
 [[p.root-12,'triangle',0.02],[p.root-5,'triangle',0.012],[p.root+4,'sine',0.009],[p.root+12,'sine',0.005]].forEach(([m,ty,a],i)=>{const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.type=ty;o.frequency.value=hz(m);lp.type='lowpass';lp.frequency.value=700;
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(a*k,t0+5);lfo(0.04+i*0.025,a*k*0.3,g.gain,t0,t0+3600);o.connect(lp);lp.connect(g);g.connect(bus);g.connect(rev);o.start(t0);bed.push({o,g})});
 if(pal=='cuencos')await sample('cuenco');
 if(!p.nat){nextEv=t0+2.5;setNote();return}
 const real=await sample(p.nat);
 if(mine!==pal||!playing)return;
 const t=ac.currentTime;
 if(real){const s=src(real),g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.7,t+5);s.connect(g);g.connect(bus);s.start(t,rnd(0,Math.max(0,real.duration-1)));bed.push({o:s,g});nextEv=Infinity;setNote();return}
 if(p.nat=='agua'){const s0=src(brown),l0=ac.createBiquadFilter(),g0=ac.createGain();l0.type='lowpass';l0.frequency.value=320;g0.gain.setValueAtTime(0.0001,t);g0.gain.linearRampToValueAtTime(0.035,t+5);s0.connect(l0);l0.connect(g0);g0.connect(bus);s0.start(t);bed.push({o:s0,g:g0});
  [[550,0.03],[1100,0.022],[2100,0.012],[3400,0.005]].forEach(([f,a],i)=>{const s=src(white),bp=ac.createBiquadFilter(),g=ac.createGain();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=0.9;lfo(0.08+i*0.045,f*0.25,bp.frequency,t,t+3600);
   g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(a,t+5);lfo(rnd(2.5,6),a*0.25,g.gain,t,t+3600);lfo(rnd(0.2,0.5),a*0.3,g.gain,t,t+3600);s.connect(bp);bp.connect(g);route(g);s.start(t,rnd(0,4));bed.push({o:s,g})})}
 if(p.nat=='bosque'){const s=src(brown),lp=ac.createBiquadFilter(),g=ac.createGain();lp.type='lowpass';lp.frequency.value=550;lfo(0.06,300,lp.frequency,t,t+3600);
   g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.08,t+5);lfo(0.07,0.035,g.gain,t,t+3600);s.connect(lp);lp.connect(g);g.connect(bus);g.connect(rev);s.start(t);bed.push({o:s,g});
   const s2=src(white),bp=ac.createBiquadFilter(),g2=ac.createGain();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=0.6;g2.gain.setValueAtTime(0.0001,t);g2.gain.linearRampToValueAtTime(0.009,t+5);
   lfo(0.07,0.008,g2.gain,t,t+3600);s2.connect(bp);bp.connect(g2);route(g2);s2.start(t,1.3);bed.push({o:s2,g:g2})}
 if(p.nat=='fuego'){const s=src(brown),lp=ac.createBiquadFilter(),g=ac.createGain();lp.type='lowpass';lp.frequency.value=220;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.13,t+5);lfo(0.15,0.03,g.gain,t,t+3600);
   s.connect(lp);lp.connect(g);g.connect(bus);s.start(t);bed.push({o:s,g});
   const s2=src(white),bp=ac.createBiquadFilter(),g2=ac.createGain();bp.type='bandpass';bp.frequency.value=1600;bp.Q.value=0.5;g2.gain.setValueAtTime(0.0001,t);g2.gain.linearRampToValueAtTime(0.004,t+5);s2.connect(bp);bp.connect(g2);g2.connect(bus);s2.start(t,2);bed.push({o:s2,g:g2})}
 nextEv=t+2.5;setNote()}
function stopBed(){if(!ac)return;const t=ac.currentTime;bed.forEach(({o,g})=>{g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0.0001,t,1.5);try{o.stop(t+8)}catch(e){}});bed=[]}
function crackle(t){const s=ac.createBufferSource();s.buffer=white;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=rnd(700,1900);bp.Q.value=0.8;const g=ac.createGain();
 const big=Math.random()<0.06,a=big?rnd(0.08,0.14):rnd(0.02,0.06),d=big?rnd(0.012,0.03):rnd(0.003,0.009);
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(a,t+0.002);g.gain.setTargetAtTime(0.0001,t+0.002,d);s.connect(bp);bp.connect(g);route(g,big);s.start(t,rnd(0,4.5),0.1);if(big)sparkQ.push({at:t})}
function events(){if(!playing)return;if(stopAt&&Date.now()>=stopAt){toggle();return}const p=P[pal],now=ac.currentTime;
 while(nextEv<now+0.15){if(p.nat=='fuego'){crackle(nextEv);nextEv+=-Math.log(1-Math.random())*0.22}else{nextEv=now+0.2;break}}}
let lastM=null;
function pick(p){const r=notes(p.lo,p.hi);for(let k=0;k<30;k++){const m=r[Math.floor(Math.random()*r.length)],pc=m%12;if(m>=p.hiFrom&&Math.random()>0.3)continue;if((pc==2||pc==9)&&Math.random()<0.5)continue;if(lastM!==null&&Math.abs(m-lastM)<3)continue;lastM=m;return m}return r[0]}
function phrase(){if(!playing)return;const p=P[pal];let t=ac.currentTime+0.15;
 if(p.seq){const semis=p.seq[seqI++%p.seq.length];voices.push(p.v(hz(p.root+semis),t,rnd(p.dur[0],p.dur[1]),false,semis));timer=setTimeout(phrase,rnd(p.gap[0],p.gap[1])*1000);return}
 const n=Math.round(rnd(p.cnt[0],p.cnt[1]));
 if(Math.random()<0.6)bass(hz(Math.random()<0.7?p.root-12:p.root-5),t,rnd(12,18));
 for(let i=0;i<n;i++){const m=pick(p),d=rnd(p.dur[0],p.dur[1]);voices.push(p.v(hz(m),t,d,m>=p.hiFrom));t+=rnd(p.sp[0],p.sp[1])}
 timer=setTimeout(phrase,(t-ac.currentTime+rnd(p.gap[0],p.gap[1]))*1000)}
function setNote(){const p=P[pal],n=document.getElementById('note');
 const real=(p.nat&&samples[p.nat])||(pal=='cuencos'&&samples.cuenco);
 n.textContent=real?'Grabación real.':(p.nat?'Sonido generado. Podés sumar una grabación real en la carpeta sounds de la app.':'Notas largas, graves presentes y silencios entre frases.')}
const playBtn=document.getElementById('play');
function toggle(){if(!ac)init();
 if(!playing){ac.resume();playing=true;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(document.getElementById('vol').value/100,ac.currentTime,1.5);
  stopAt=timerMin?Date.now()+timerMin*60000:0;startBed();phrase();evTimer=setInterval(events,50);playBtn.textContent='Pausar'}
 else{playing=false;clearTimeout(timer);clearInterval(evTimer);master.gain.setTargetAtTime(0.0001,ac.currentTime,0.8);stopBed();playBtn.textContent='Escuchar'}}
playBtn.addEventListener('click',toggle);
const timers=[0,15,30,60];document.getElementById('timer').addEventListener('click',e=>{timerMin=timers[(timers.indexOf(timerMin)+1)%timers.length];
 e.currentTarget.textContent=timerMin?'Apagar en '+timerMin+' min':'Sin temporizador';stopAt=playing&&timerMin?Date.now()+timerMin*60000:0});
document.getElementById('vol').addEventListener('input',e=>{if(ac&&playing)master.gain.setTargetAtTime(e.target.value/100,ac.currentTime,0.3)});
const pitchEl=document.getElementById('pitch'),pito=document.getElementById('pito'),saved={};
try{Object.assign(saved,JSON.parse(localStorage.getItem('tono')||'{}'))}catch(e){}
function showPitch(){pito.textContent=(shift>0?'+':shift<0?'−':'')+Math.abs(shift)}
pitchEl.addEventListener('input',e=>{shift=+e.target.value;saved[pal]=shift;showPitch();try{localStorage.setItem('tono',JSON.stringify(saved))}catch(err){}});
pitchEl.addEventListener('change',()=>{if(playing)startBed()});
document.getElementById('tun').addEventListener('click',e=>{ref=ref==440?432:440;e.currentTarget.textContent=ref+' Hz';e.currentTarget.classList.toggle('on',ref==432);if(playing)startBed()});
function selectPal(name){pal=name;lastM=null;seqI=0;shift=saved[pal]!==undefined?saved[pal]:P[pal].sh;pitchEl.value=shift;showPitch();
 document.querySelectorAll('.pal[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p==pal));setNote();
 if(playing){clearTimeout(timer);startBed();timer=setTimeout(phrase,2000)}}
document.querySelectorAll('.pal[data-p]').forEach(b=>b.addEventListener('click',()=>selectPal(b.dataset.p)));
selectPal('bruma');
// Visual: bruma abstracta sobre fondo claro, sin centro quemado, transiciones de unos 5 segundos.
const N=9,blobs=[],sparks=[],sparkQ=[],w={calm:1,agua:0,bosque:0,fuego:0};
for(let i=0;i<N;i++)blobs.push({x:0.5,y:0.5,r:0.17+0.035*(i%5),c:[120,150,190],s:Math.random()*100,vx:0,vy:0,i});
const fireCol=h=>h<0.35?[245,190-h*140,100-h*100]:h<0.75?[240-(h-0.35)*100,141-(h-0.35)*170,65-(h-0.35)*40]:[200-(h-0.75)*200,73-(h-0.75)*80,49];
function newSpark(){sparks.push({x:0.5+rnd(-0.18,0.18),y:rnd(0.7,0.95),vx:rnd(-0.012,0.012),vy:-rnd(0.03,0.06),life:rnd(4,7),age:0})}
let ph=0,lt=performance.now();
function draw(now){const dt=Math.min(0.05,(now-lt)/1000);lt=now;ph+=dt;const p=P[pal];
 for(const k in w)w[k]+=((p.mode==k?1:0)-w[k])*Math.min(1,dt/1.5);
 let e=playing?0.15:0;if(ac){const t=ac.currentTime;voices=voices.filter(v=>t<v.t+v.d+6);voices.forEach(v=>{const x=t-v.t;if(x>0)e+=v.peak*Math.min(1,x/3)*Math.exp(-Math.max(0,x-v.d*0.6)/3)});
  while(sparkQ.length&&sparkQ[0].at<=t){sparkQ.shift();if(w.fuego>0.5)newSpark()}}
 energy+=(Math.min(1.5,e)-energy)*Math.min(1,dt*0.6);
 const gust=0.5+0.5*Math.sin(ph*0.3)*Math.sin(ph*0.11+1);
 cx.fillStyle='rgba(250,247,239,0.16)';cx.fillRect(0,0,W,H);
 blobs.forEach(b=>{const s=b.s,i=b.i,h=clamp(1-b.y,0,1),a=ph*0.045+i*(6.283/N);
  const hx=0.5+Math.cos(a)*(0.16+0.05*(i%3)),hy=0.5+Math.sin(a*1.3)*(0.14+0.04*(i%2));
  const tx=w.calm*(hx-b.x)*0.6+w.agua*(0.03+0.008*Math.sin(s))+w.bosque*(0.03*(gust-0.3)*Math.sin(ph*0.2+s)+0.012*gust+(hx-b.x)*0.05)+w.fuego*(0.012*Math.sin(ph*0.35+s*3)-(b.x-0.5)*0.08);
  const ty=w.calm*(hy-b.y)*0.6+w.agua*(0.012*Math.sin(ph*0.25+b.x*6+s)+(hy-b.y)*0.15)+w.bosque*(0.008*Math.sin(ph*0.15+s)+(hy-b.y)*0.15)-w.fuego*(0.035+0.025*(s%1));
  b.vx+=(tx-b.vx)*Math.min(1,dt*1.2);b.vy+=(ty-b.vy)*Math.min(1,dt*1.2);b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(w.agua+w.bosque>0.5){if(b.x>1.4)b.x=-0.4;if(b.x<-0.4)b.x=1.4}
  if(w.fuego>0.5&&b.y<-0.35){b.y=1.35;b.x=0.5+rnd(-0.2,0.2)}
  const pc=p.c[i%2],fc=fireCol(h),col=[0,1,2].map(k=>pc[k]+(fc[k]-pc[k])*w.fuego);
  for(let k=0;k<3;k++)b.c[k]+=(col[k]-b.c[k])*Math.min(1,dt*0.9);
  const stretch=1+0.7*w.agua+0.25*w.bosque,alpha=(0.08+0.07*energy)*(1-w.fuego*0.5*h),R=Math.min(W,H)*b.r*1.3*(1-w.fuego*0.4*h)*(0.9+0.3*energy+0.05*Math.sin(ph*0.3+i)),x=b.x*W,y=b.y*H;
