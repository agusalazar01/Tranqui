<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F3EFE5">
<title>Sonidos de Tranqui</title>
<style>
:root{--lino:#F3EFE5;--papel:#FAF7EF;--borde:#E4DDCF;--salvia:#A7B39B;--salvia-clara:#E3E6D8;--bosque:#344C40;--texto2:#68766A;--arcilla:#D5A080;--arena:#D9D2C5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--lino);color:var(--bosque);font-family:system-ui,-apple-system,"Roboto",sans-serif;overflow:hidden}
body{padding:0 1px 10px}
#scene{position:relative;height:190px;border-radius:25px;overflow:hidden;background:linear-gradient(145deg,#f9f6ee,#e9e8dc 55%,#e4e8dd)}
#cv{width:100%;height:100%;display:block}
.scene-copy{position:absolute;left:20px;bottom:17px;pointer-events:none}
.scene-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#637365;opacity:.8}
.scene-title{font-family:Georgia,serif;font-size:26px;line-height:1.1;margin-top:3px;color:#344c40}
.scene-sub{font-size:12px;color:#637365;margin-top:5px}
.cat{font-family:Georgia,serif;font-size:17px;margin:16px 4px 7px;color:var(--bosque)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.sound{display:flex;align-items:center;gap:10px;min-height:56px;padding:9px 11px;border:1px solid var(--borde);border-radius:19px;background:var(--papel);color:var(--bosque);text-align:left;font:inherit;transition:background .25s,border-color .25s,transform .25s}
.sound:active{transform:scale(.985)}
.sound.on{background:#e5e9df;border-color:#9eac9d;box-shadow:inset 0 0 0 1px #b8c3b3}
.symbol{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e9e8dc;flex:none}
.symbol svg{width:20px;height:20px}
.sound.on .symbol{background:#d2ddcf}
.sound strong{display:block;font-size:14px;font-weight:600;line-height:1.15}
.sound small{display:block;font-size:10px;color:var(--texto2);margin-top:3px}
.controls{position:sticky;top:0;z-index:2;margin-top:12px;padding:12px 14px 11px;border:1px solid var(--borde);border-radius:21px;background:rgba(250,247,239,.97)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--texto2)}
.topline strong{font-size:13px;color:var(--bosque);font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin-top:6px}
.row label{font-size:12px;color:var(--texto2);width:57px}
input[type=range]{flex:1;accent-color:var(--bosque);height:28px;min-width:0}
.val{font-size:11px;color:var(--texto2);width:34px;text-align:right}
.actions{display:flex;gap:9px;margin-top:9px}
.btn{flex:1;min-height:47px;border-radius:24px;border:0;font:600 14px system-ui,-apple-system,"Roboto",sans-serif}
.play{background:var(--bosque);color:var(--lino)}
.soft{background:#ece9df;color:var(--bosque);border:1px solid var(--borde)}
#note{font-size:11px;line-height:1.45;color:var(--texto2);margin:10px 3px 0;min-height:15px}
details{margin:16px 3px 0;font-size:11px;color:var(--texto2);line-height:1.5}
summary{font-size:12px;color:var(--bosque);cursor:pointer;min-height:32px}
.explore{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px;min-height:58px;padding:12px 16px;border:0;border-radius:21px;background:var(--bosque);color:var(--lino);font:600 15px system-ui,-apple-system,"Roboto",sans-serif;text-align:left}
.explore small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
.libhead{display:flex;align-items:center;gap:10px;margin:16px 2px 6px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--borde);background:var(--papel);color:var(--bosque);font-size:18px}
.libtitle{font-family:Georgia,serif;font-size:22px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 1px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--borde);background:var(--papel);color:var(--bosque);font:13px system-ui,-apple-system,"Roboto",sans-serif}
.chip.on{background:var(--bosque);color:var(--lino);border-color:var(--bosque)}
.hidden{display:none}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.sound{transition:none}}
</style>
</head>
<body>
<section id="scene" aria-label="Visualización del paisaje sonoro">
 <canvas id="cv"></canvas>
 <div class="scene-copy"><div class="scene-kicker">Un momento para vos</div><div class="scene-title" id="sceneTitle">Arroyo</div><div class="scene-sub" id="sceneSub">Agua entre piedras</div></div>
</section>
<section class="controls">
 <div class="topline"><span>Ahora suena</span><strong id="currentLabel">Arroyo</strong></div>
 <div class="row"><label for="vol">Volumen</label><input id="vol" type="range" min="0" max="100" value="62"><span class="val" id="volumeValue">62%</span></div>
 <div class="row"><label for="pitch">Tono</label><input id="pitch" type="range" min="-6" max="6" step="1" value="0"><span class="val" id="pitchValue">0</span></div>
 <div class="actions"><button id="play" class="btn play">Escuchar</button><button id="timer" class="btn soft">Sin temporizador</button></div>
</section>
<div id="home"><div class="cat">Para empezar</div><div class="grid" id="featured"></div>
<button class="explore" id="openLib"><span>Explorar la biblioteca<small id="libCount">Agua, lluvia, campo, noche, fuego, hogar, viaje y ruidos</small></span><span aria-hidden="true">›</span></button></div>
<div id="library" class="hidden"><div class="libhead"><button class="back" id="closeLib" aria-label="Volver">‹</button><div class="libtitle">Biblioteca de sonidos</div></div>
<div class="chips" id="chips"></div><div id="catalog"></div></div>
<p id="note" role="status">Grabaciones reales en alta calidad, incluidas en la app: funcionan sin internet. Mejor con auriculares.</p>
<details><summary>Créditos de los sonidos</summary><div id="credits"></div></details>
<script>
// Íconos simples, en el estilo orgánico de Tranqui (sin emojis).
const ICON={
 agua:'<path d="M2 13c3-3 5 3 8 0s5 3 8 0" stroke="#344C40" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M2 8c3-3 5 3 8 0s5 3 8 0" stroke="#6F8774" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
 lluvia:'<path d="M6 3c2 3 3 4.5 3 6a3 3 0 0 1-6 0c0-1.5 1-3 3-6z" fill="#6F8774"/><path d="M14 8c2 3 3 4.5 3 6a3 3 0 0 1-6 0c0-1.5 1-3 3-6z" fill="#344C40"/>',
 bosque:'<path d="M10 2c5 3 6 9 0 16C4 11 5 5 10 2z" fill="#6F8774"/><path d="M10 6v12" stroke="#344C40" stroke-width="1.4" stroke-linecap="round"/>',
 noche:'<path d="M13 3a7 7 0 1 0 4 12A6 6 0 0 1 13 3z" fill="#6F8774"/>',
 fuego:'<path d="M10 2c4 4 6 7 6 10a6 6 0 0 1-12 0c0-2 1-4 3-5 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#D5A080"/>',
 cuenco:'<path d="M3 9h14a7 7 0 0 1-14 0z" fill="#B89774"/><circle cx="10" cy="5" r="1.6" fill="#D5A080"/>',
 hogar:'<path d="M3 10l7-6 7 6v7H3z" fill="#C4A080"/><rect x="8" y="12" width="4" height="5" fill="#F3EFE5"/>',
 viaje:'<rect x="3" y="5" width="14" height="9" rx="3" fill="#8C96A0"/><circle cx="7" cy="16" r="1.6" fill="#344C40"/><circle cx="13" cy="16" r="1.6" fill="#344C40"/>',
 musica:'<path d="M8 4l9-2v10" stroke="#6E6488" stroke-width="1.6" fill="none"/><circle cx="6" cy="14" r="2.6" fill="#968CAA"/><circle cx="15" cy="12" r="2.6" fill="#6E6488"/><path d="M8 4v10" stroke="#968CAA" stroke-width="1.6"/>',
 ruido:'<path d="M2 10c2-4 4 4 6 0s4 4 6 0 3 3 4 0" stroke="#68766A" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
};
const COLORS={agua:[[111,157,174],[156,183,180]],lluvia:[[133,157,164],[177,188,178]],bosque:[[119,151,119],[173,178,137]],noche:[[120,131,150],[166,171,165]],
 fuego:[[207,143,93],[181,105,76]],cuenco:[[184,151,116],[211,187,143]],ruido:[[166,171,165],[197,194,180]],hogar:[[196,160,128],[214,196,170]],
 viaje:[[140,150,160],[190,190,180]],musica:[[150,140,170],[196,186,200]]};
const $=id=>document.getElementById(id);
function nativeCall(m,...a){try{const api=window.TranquiApp;if(api&&typeof api[m]==='function')return api[m](...a)}catch(e){}return null}
// Solo se muestran los sonidos que están dentro de la app.
const files=(nativeCall('available')||'').split(',').filter(Boolean);
let CAT={groups:[],sounds:[]};
try{const r=new XMLHttpRequest();r.open('GET','catalogo.json',false);r.send();CAT=JSON.parse(r.responseText)}catch(e){}
const INFO={};
CAT.sounds.forEach(x=>{if(!files.length||files.includes(x.id))INFO[x.id]={title:x.title,sub:x.sub,kind:x.kind,src:x.credit,group:x.group,featured:x.featured}});
let selected=INFO.arroyo?'arroyo':Object.keys(INFO)[0],playing=false,timerMin=0,volume=62,pitch=0,group='';
function card(id){const d=INFO[id],b=document.createElement('button');b.className='sound';b.dataset.id=id;
 b.innerHTML='<span class="symbol"><svg viewBox="0 0 20 20" aria-hidden="true">'+(ICON[d.kind]||ICON.ruido)+'</svg></span><span><strong>'+d.title+'</strong><small>'+d.sub+'</small></span>';
 b.addEventListener('click',()=>{selected=id;nativeCall('select',id);if(playing)nativeCall('play',id);render()});return b}
const featured=$('featured');Object.keys(INFO).filter(id=>INFO[id].featured).forEach(id=>featured.appendChild(card(id)));
$('libCount').textContent=Object.keys(INFO).length+' sonidos: agua, lluvia, campo, noche, fuego, hogar, viaje y ruidos';
function buildLibrary(){const cat=$('catalog');cat.innerHTML='';
 CAT.groups.forEach(g=>{if(group&&g!==group)return;const ids=Object.keys(INFO).filter(id=>INFO[id].group===g);if(!ids.length)return;
  const h=document.createElement('div');h.className='cat';h.textContent=g;cat.appendChild(h);
  const grid=document.createElement('div');grid.className='grid';ids.forEach(id=>grid.appendChild(card(id)));cat.appendChild(grid)});
 render();setTimeout(report,50)}
const chips=$('chips');['',...CAT.groups].forEach(g=>{if(g&&!Object.values(INFO).some(d=>d.group===g))return;
 const c=document.createElement('button');c.className='chip'+(g===''?' on':'');c.textContent=g||'Todos';
 c.addEventListener('click',()=>{group=g;chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));buildLibrary()});chips.appendChild(c)});
$('openLib').addEventListener('click',()=>{$('home').classList.add('hidden');$('library').classList.remove('hidden');buildLibrary();nativeCall('scrollTop')});
$('closeLib').addEventListener('click',()=>{$('library').classList.add('hidden');$('home').classList.remove('hidden');render();setTimeout(report,50)});
$('credits').innerHTML='Grabaciones de dominio público (CC0) de Freesound y BigSoundBank. Tranqui las recortó, igualó el volumen sin comprimir y empalmó para que suenen en bucle.<br><br>'+
 Object.values(INFO).map(i=>'<b>'+i.title+'</b>: '+i.src).join('<br>');
function sync(){const p=nativeCall('isPlaying');if(p!==null)playing=!!p;const s=nativeCall('currentSound');if(s&&INFO[s])selected=s;
 const v=nativeCall('currentVolume');if(typeof v==='number'){volume=Math.round(v*100);$('vol').value=volume;$('volumeValue').textContent=volume+'%'}
 const t=nativeCall('currentTimer');if(typeof t==='number')timerMin=t;
 const pt=nativeCall('currentPitch');if(typeof pt==='number'){pitch=pt;$('pitch').value=pitch;showPitch()}
 const err=nativeCall('lastError');if(err)$('note').textContent='No se pudo reproducir el sonido ('+err+').';render()}
function showPitch(){$('pitchValue').textContent=(pitch>0?'+':pitch<0?'−':'')+Math.abs(pitch)}
let painted='';function render(){const d=INFO[selected];if(!d)return;if(painted!==selected){try{paint();painted=selected}catch(e){}}$('sceneTitle').textContent=d.title;$('sceneSub').textContent=d.sub;$('currentLabel').textContent=d.title;
 $('play').textContent=playing?'Pausar':'Escuchar';$('timer').textContent=timerMin?'Apagar en '+timerMin+' min':'Sin temporizador';
 document.querySelectorAll('.sound').forEach(b=>b.classList.toggle('on',b.dataset.id===selected))}
$('play').addEventListener('click',()=>{if(playing){nativeCall('pause');playing=false}else{nativeCall('play',selected);playing=true}render()});
$('vol').addEventListener('input',e=>{volume=+e.target.value;$('volumeValue').textContent=volume+'%';nativeCall('setVolume',volume/100)});
$('pitch').addEventListener('input',e=>{pitch=+e.target.value;showPitch();nativeCall('setPitch',pitch)});
const timerOptions=[0,15,30,60];$('timer').addEventListener('click',()=>{timerMin=timerOptions[(timerOptions.indexOf(timerMin)+1)%timerOptions.length];nativeCall('setTimer',timerMin);render()});
sync();setInterval(sync,1000);
// Le avisa a la app cuánto mide la página, así no hace falta scroll interno.
function report(){nativeCall('height',Math.ceil(document.documentElement.scrollHeight))}
addEventListener('load',report);document.querySelector('details').addEventListener('toggle',report);setTimeout(report,300);
// Escena de la bruma: una imagen quieta que cambia de color con cada sonido (sin animación).
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0;
const blobs=Array.from({length:11},(_,i)=>({r:.13+(i%4)*.025,seed:i*2.31}));
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=cv.width=Math.max(1,Math.round(r.width*d));H=cv.height=Math.max(1,Math.round(r.height*d));paint()}
function paint(){if(!W)return;const d=INFO[selected]||{kind:'agua'},cols=COLORS[d.kind];
 cx.fillStyle='#f8f5ed';cx.fillRect(0,0,W,H);
 blobs.forEach((b,i)=>{const x=.5+Math.cos(b.seed)*(.16+(i%3)*.04),y=.5+Math.sin(b.seed*1.3)*(.14+(i%4)*.03);
  const c=cols[i%2],alpha=.14,R=Math.min(W,H)*b.r*1.05,g=cx.createRadialGradient(x*W,y*H,0,x*W,y*H,R);
  g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${alpha})`);g.addColorStop(.62,`rgba(${c[0]},${c[1]},${c[2]},${alpha*.5})`);g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
  cx.fillStyle=g;cx.beginPath();cx.arc(x*W,y*H,R,0,Math.PI*2);cx.fill()})}
addEventListener('resize',()=>{resize();report()});resize();painted=selected;
render();
</script>
</body>
</html>
